<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무지개 표 R1~R10</title>
<style>
:root{--bg:#f6f6f4;--fg:#1f1f1f;--card:#fff;--line:#ddd;--btn:#2b59c3;--btnfg:#fff;--muted:#777;--up:#2e7d32;--down:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171717;--fg:#eee;--card:#222;--line:#3a3a3a;--btn:#6b8fe8;--btnfg:#111;--muted:#999;--up:#66bb6a;--down:#ef5350}}
:root[data-theme="dark"]{--bg:#171717;--fg:#eee;--card:#222;--line:#3a3a3a;--btn:#6b8fe8;--btnfg:#111;--muted:#999;--up:#66bb6a;--down:#ef5350}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:6px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.tab{background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 20px}
.tab.active{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
main{max-width:960px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:8px;padding:10px 22px;font-size:16px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.hidden{display:none}
.msg{margin-top:24px;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.card h2{margin:0 0 8px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:5px 6px;border-top:1px solid var(--line)}
td.v{text-align:right;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#pcard{max-width:420px;margin:20px auto 0;padding:16px}
#pcard h2{font-size:24px;margin-bottom:12px}
#pcard table{font-size:20px}
#pcard td{padding:10px 8px}
#pcard td.d{text-align:right;font-size:15px;width:64px}
.up{color:var(--up)}.down{color:var(--down)}.same{color:var(--muted)}
.ctrl{display:flex;justify-content:center;gap:10px;margin-top:16px}
.banner{margin:12px 0 4px;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-weight:600}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:620px){.teams{grid-template-columns:1fr}}
.team{padding:14px}
.team.t0{border-top:4px solid #1e88e5}
.team.t1{border-top:4px solid #e53935}
.side{font-size:12px;margin-bottom:6px}
.nm{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.nm input{flex:1;min-width:0;font-size:18px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.total{font-size:28px;font-weight:700}
.eq{font-size:16px;margin-top:2px}
.cap{font-size:12px}
.addrow{display:flex;align-items:center;gap:10px;margin:10px 0}
button.plus{font-size:22px;padding:4px 18px}
button.sm{font-size:13px;padding:5px 10px;margin-left:4px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:500;padding:4px 6px}
td.act{text-align:right;white-space:nowrap}
.hold{margin-top:12px}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px}
#snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#333;color:#fff;padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90%;text-align:center}
#snack.on{opacity:1}
</style>
</head>
<body>
<nav>
<button class="tab active" id="tab-main">메인</button>
<button class="tab" id="tab-gen">생성</button>
<button class="tab" id="tab-pres">발표</button>
</nav>
<main>
<section id="view-main">
<h1>메인</h1>
<p class="sub">두 팀 합쳐 한 종목은 최대 10개까지 보유할 수 있습니다 (수수료 없음)</p>
<div id="mnodata" class="msg hidden">먼저 '생성' 탭에서 표를 생성해야 종목을 거래할 수 있습니다.</div>
<div id="round" class="sub"></div>
<div id="banner" class="banner"></div>
<div id="teams" class="teams"></div>
</section>
<section id="view-gen" class="hidden">
<h1>무지개 표 R1 ~ R10</h1>
<p class="sub">R1은 전부 10, 이후 라운드마다 -6 ~ +6 랜덤 변동 (최솟값 1)</p>
<button id="gen">생성</button>
<div id="empty" class="msg">아직 생성된 표가 없습니다. '생성' 버튼을 눌러주세요.</div>
<div id="grid"></div>
</section>
<section id="view-pres" class="hidden">
<div id="pnone" class="msg">먼저 '생성' 탭에서 표를 생성해주세요.</div>
<div id="pbox" class="hidden">
<div class="card" id="pcard"></div>
<div class="ctrl">
<button class="ghost" id="prev">이전 라운드</button>
<button id="next">다음 라운드</button>
</div>
</div>
</section>
</main>
<div id="snack"></div>
<script>
var COLORS=[["빨강","#e53935"],["주황","#fb8c00"],["노랑","#fdd835"],["초록","#43a047"],["파랑","#1e88e5"],["남색","#3949ab"],["보라","#8e24aa"]];
var KEY="rainbow-tables-v2",IKEY="rainbow-present-idx-v2",MKEY="rainbow-main-v1";
function lget(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function make(){
  var rounds=[],cur=COLORS.map(function(){return 10});
  rounds.push(cur);
  for(var r=1;r<10;r++){
    cur=cur.map(function(v){return Math.max(1,v+Math.floor(Math.random()*13)-6)});
    rounds.push(cur);
  }
  return rounds;
}
var data=lget(KEY),idx=lget(IKEY)||0;
if(!data||idx<0||idx>=data.length)idx=0;

/* ---------- 생성 ---------- */
function renderGen(){
  var g=document.getElementById("grid");g.innerHTML="";
  document.getElementById("empty").classList.toggle("hidden",!!data);
  if(!data)return;
  data.forEach(function(vals,i){
    var c=document.createElement("div");c.className="card";
    var rows=COLORS.map(function(col,j){
      return '<tr><td><span class="dot" style="background:'+col[1]+'"></span>'+col[0]+'</td><td class="v">'+vals[j]+'</td></tr>';
    }).join("");
    c.innerHTML='<h2>R'+(i+1)+'</h2><table>'+rows+'</table>';
    g.appendChild(c);
  });
}

/* ---------- 발표 ---------- */
function renderPres(){
  document.getElementById("pnone").classList.toggle("hidden",!!data);
  document.getElementById("pbox").classList.toggle("hidden",!data);
  if(!data)return;
  var vals=data[idx],prev=idx>0?data[idx-1]:null;
  var rows=COLORS.map(function(col,j){
    var d="";
    if(prev){var diff=vals[j]-prev[j];d=diff>0?'<span class="up">▲ '+diff+'</span>':diff<0?'<span class="down">▼ '+(-diff)+'</span>':'<span class="same">–</span>'}
    return '<tr><td><span class="dot" style="background:'+col[1]+'"></span>'+col[0]+'</td><td class="v">'+vals[j]+'</td><td class="d">'+d+'</td></tr>';
  }).join("");
  document.getElementById("pcard").innerHTML='<h2>R'+(idx+1)+' <span class="same" style="font-size:14px">/ '+data.length+'</span></h2><table>'+rows+'</table>';
  document.getElementById("prev").disabled=idx===0;
  var n=document.getElementById("next");
  n.disabled=idx>=data.length-1;
  n.textContent=idx>=data.length-1?"마지막 라운드":"다음 라운드";
}

/* ---------- 메인 ---------- */
function blank(n){return {name:n,cash:30,hold:COLORS.map(function(){return 0})}}
var M=lget(MKEY);
if(!M||!M.teams||M.teams.length!==2||M.teams.some(function(t){return !t.hold||t.hold.length!==COLORS.length}))M={teams:[blank("왼쪽"),blank("오른쪽")]};
var reveal=[false,false];
function saveM(){lset(MKEY,M)}
function nm(i){return M.teams[i].name||(i?"오른쪽":"왼쪽")}
function price(j){return data&&data[idx]?data[idx][j]:0}
function inv(t){var s=0;for(var j=0;j<COLORS.length;j++)s+=t.hold[j]*price(j);return s}
var st;
function toast(m){var s=document.getElementById("snack");s.textContent=m;s.classList.add("on");clearTimeout(st);st=setTimeout(function(){s.classList.remove("on")},2200)}

var tm=document.getElementById("teams");
[0,1].forEach(function(i){
  var d=document.createElement("div");d.className="card team t"+i;
  d.innerHTML='<div class="side same">'+(i?"오른쪽":"왼쪽")+' 구역</div>'
   +'<div class="nm"><input data-n="'+i+'" maxlength="12" placeholder="팀 이름"><span>팀</span></div>'
   +'<div class="total" id="total'+i+'"></div><div class="eq" id="eq'+i+'"></div>'
   +'<div class="cap same">보유 금액 + 투자 합계 = 총액</div>'
   +'<div class="addrow"><button class="plus" data-a="plus" data-t="'+i+'">+</button><span class="same">문제 정답 시 +10</span></div>'
   +'<table id="stk'+i+'"></table>'
   +'<div class="hold"><button class="ghost sm" id="revbtn'+i+'" data-a="rev" data-t="'+i+'"></button><div class="chips" id="hold'+i+'"></div></div>';
  tm.appendChild(d);
  d.querySelector("input").value=M.teams[i].name;
});

function renderMain(){
  document.getElementById("mnodata").classList.toggle("hidden",!!data);
  document.getElementById("round").textContent=data?"현재 R"+(idx+1)+" 가격 기준 (발표 탭에서 라운드를 넘기면 가격이 바뀝니다)":"";
  var tot=[];
  [0,1].forEach(function(i){
    var t=M.teams[i],iv=inv(t),tt=t.cash+iv;
    tot[i]=tt;
    document.getElementById("total"+i).textContent="총액 "+tt;
    document.getElementById("eq"+i).textContent=t.cash+" + "+iv+" = "+tt;
    var h='<tr><th>종목</th><th style="text-align:right">현재가</th><th></th></tr>';
    COLORS.forEach(function(c,j){
      h+='<tr><td><span class="dot" style="background:'+c[1]+'"></span>'+c[0]+'</td><td class="v">'+(data?price(j):"-")+'</td><td class="act">'
        +'<button class="sm" data-a="buy" data-t="'+i+'" data-j="'+j+'">구매</button>'
        +'<button class="sm ghost" data-a="sell" data-t="'+i+'" data-j="'+j+'">판매</button></td></tr>';
    });
    document.getElementById("stk"+i).innerHTML=h;
    var hb=document.getElementById("hold"+i);
    if(!reveal[i]){hb.innerHTML='<span class="same">보유 종목이 가려져 있습니다</span>'}
    else{
      var items=[];
      COLORS.forEach(function(c,j){if(t.hold[j]>0)items.push('<span class="chip"><span class="dot" style="background:'+c[1]+'"></span>'+c[0]+' × '+t.hold[j]+'</span>')});
      hb.innerHTML=items.length?items.join(""):'<span class="same">보유 종목 없음</span>';
    }
    document.getElementById("revbtn"+i).textContent=reveal[i]?"보유 종목 가리기":"보유 종목 보기";
  });
  document.getElementById("banner").textContent=tot[0]===tot[1]
    ?"두 팀 총액이 같습니다 ("+tot[0]+")"
    :(tot[0]>tot[1]?nm(0):nm(1))+"팀이 "+Math.abs(tot[0]-tot[1])+" 앞서고 있습니다 ("+tot[0]+" : "+tot[1]+")";
}

var vm=document.getElementById("view-main");
vm.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!b.dataset.a)return;
  var a=b.dataset.a,i=+b.dataset.t,j=+b.dataset.j,t=M.teams[i];
  if(a==="rev"){reveal[i]=!reveal[i]}
  else if(a==="plus"){t.cash+=10;toast(nm(i)+"팀이 문제를 맞췄습니다")}
  else{
    if(!data){toast("먼저 '생성' 탭에서 표를 생성해주세요");return}
    var p=price(j);
    if(a==="buy"){
      if(t.cash<p){toast("보유 금액이 부족합니다");return}
      if(M.teams[0].hold[j]+M.teams[1].hold[j]>=10){toast("이 종목은 두 팀 합쳐 최대 10개까지입니다");return}
      t.cash-=p;t.hold[j]++;
    }else{
      if(t.hold[j]<=0){toast("보유한 수량이 없습니다");return}
      t.cash+=p;t.hold[j]--;
    }
  }
  saveM();renderMain();
});
vm.addEventListener("input",function(e){
  var n=e.target.dataset.n;if(n===undefined)return;
  M.teams[+n].name=e.target.value.trim();saveM();renderMain();
});

/* ---------- 탭 / 이벤트 ---------- */
function show(v){
  ["main","gen","pres"].forEach(function(k){
    document.getElementById("view-"+k).classList.toggle("hidden",k!==v);
    document.getElementById("tab-"+k).classList.toggle("active",k===v);
  });
  if(v==="pres")renderPres();
  if(v==="main")renderMain();
}
["main","gen","pres"].forEach(function(k){document.getElementById("tab-"+k).onclick=function(){show(k)}});
document.getElementById("gen").onclick=function(){
  if(data&&!confirm("이미 생성된 표가 있습니다. 새로 생성할까요?"))return;
  data=make();idx=0;lset(KEY,data);lset(IKEY,idx);renderGen();
};
document.getElementById("next").onclick=function(){if(idx<data.length-1){idx++;lset(IKEY,idx);renderPres()}};
document.getElementById("prev").onclick=function(){if(idx>0){idx--;lset(IKEY,idx);renderPres()}};
renderGen();
show("main");
</script>
</body>
</html>
